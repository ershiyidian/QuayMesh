name: QuayMesh CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:node
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec tsx --test --test-concurrency=1 --test-timeout=120000 src/roots.test.ts src/session/path-alias.test.ts src/db/*.test.ts src/console-workbench/*.test.ts src/session/console-lifecycle.test.ts src/session/admission-retry.test.ts src/session/revert.test.ts src/project-archive.test.ts src/federation/transfer-store.test.ts test/lifecycle-view.test.ts test/reliability-system/card-timing.test.ts
      - run: pnpm test:console
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: pnpm test:console:browser

name: Platform packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 10.0.x
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: rustup default 1.95.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - if: runner.os == 'Windows'
        run: choco install protoc -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:components --source
      - run: pnpm build:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: quaymesh-${{ runner.os }}-x64
          path: releases/*.zip

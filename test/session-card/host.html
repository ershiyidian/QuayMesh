<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuayMesh MCP Apps Host</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #111; color: #eee; }
    body { margin: 0; padding: 20px; }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    #status { margin-left: auto; font-size: 13px; color: #aaa; }
    #app-frame { width: 100%; max-width: 100%; height: 760px; border: 1px solid #333; border-radius: 12px; background: #000; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <button id="run-command" type="button">Run real command</button>
    <button id="run-patch" type="button">Run real patch</button>
    <button id="attach-workspace" type="button">Attach real workspace</button>
    <button id="disconnect" type="button">Disconnect MCP</button>
    <button id="reconnect" type="button">Reconnect MCP</button>
    <button id="teardown" type="button">Teardown iframe</button>
    <span id="status">starting</span>
  </header>
  <iframe id="app-frame" title="QuayMesh session card"></iframe>
  <pre id="log"></pre>
  <script type="module" src="/test/session-card/host-client.ts"></script>
</body>
</html>
